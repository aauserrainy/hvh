<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CS:GO HvH - Online 1v1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--a:#3f84e8;--bg:#121316;--tx:#c8c8c8;box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:11px Tahoma,Verdana,sans-serif;color:var(--tx)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#hint{position:absolute;left:50%;top:42%;transform:translateX(-50%);text-align:center;font-size:13px;line-height:1.8;pointer-events:none;text-shadow:0 1px 2px #000}
#m{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:720px;max-width:96vw;display:none;user-select:none;background:var(--bg);border:1px solid #000;outline:1px solid #333}
#m .bar{height:2px;background:linear-gradient(90deg,#9fca2b,#34c4e5,#a057e8,#ff8a3d)}
#hd{display:none}
.body{display:flex;min-height:430px}
#tabs{width:80px;background:linear-gradient(90deg,#050506,#0b0c0e);border-right:1px solid #000}
#tabs div{height:84px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#777;cursor:pointer;border-bottom:1px solid #000;filter:grayscale(1)}
#tabs div.on{background:linear-gradient(90deg,#121316,#17191d);color:#f2f2f2}
#pg{flex:1;padding:16px 14px;overflow:auto;max-height:72vh;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-content:start}
.g{border:1px solid #2b2b2b;background:#1c1c1c;padding:12px 10px 4px;position:relative}
.g b{position:absolute;top:-7px;left:8px;background:#1c1c1c;padding:0 4px;color:#ddd}
.r{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;gap:8px;break-inside:avoid}
.r span{flex:1}.r.c{flex-direction:row-reverse;justify-content:flex-end}
.r.s{flex-direction:column;align-items:stretch;gap:4px}.r.s em{text-align:center;font-style:normal}
.cb{width:9px;height:9px;background:#2a2a2a;border:1px solid #000;cursor:pointer}.cb.on{background:var(--a)}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border:1px solid #000;margin:0;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
select{background:#222;color:var(--tx);border:1px solid #000;font:11px Tahoma;width:130px}
input[type=color]{width:24px;height:14px;padding:0;border:1px solid #000;background:none}
button{background:#222;color:#ccc;border:1px solid #000;width:130px;font:11px Tahoma}
#m.nl{width:780px;background:linear-gradient(180deg,#041421,#02080f);border:1px solid #0b2a3a;outline:0;border-radius:8px;font:600 14px Ubuntu,'Segoe UI',Arial,sans-serif;color:#fff;box-shadow:0 0 50px #000c}
#m.nl .bar{display:none}#m.nl #hd{display:flex;align-items:center;gap:20px;padding:16px 22px}
#hd .lg{width:34px;height:34px;border:4px solid var(--a);border-radius:50%;box-shadow:inset 0 0 0 5px #03111b,inset 0 0 0 8px var(--a)}
#hd .nv span{margin-right:18px;cursor:pointer;font-size:16px;font-weight:700}#hd .nv span.on{color:var(--a)}
#hd .pf{margin-left:auto;display:flex;align-items:center;gap:10px}#hd .av{width:52px;height:52px;border-radius:50%;background:radial-gradient(#f0c4b4,#8a5a6a);border:2px solid #0b2a3a}
#m.nl .body{border-top:1px solid #0b2a3a;min-height:440px}
#m.nl #tabs{width:140px;background:none;border:0;padding-top:60px}
#m.nl #tabs div{height:auto;display:block;padding:12px 0;font-size:16px;text-align:center;border:0;color:#fff;filter:none}#m.nl #tabs div.on{color:var(--a);background:none}
#m.nl #pg{display:block;padding:10px 30px}
#m.nl .g{background:none;border:0;padding:0;column-count:2;column-gap:50px}
#m.nl .g b{position:static;display:block;column-span:all;background:none;color:var(--a);font-size:17px;margin-bottom:14px;padding:0;border-bottom:1px solid #0b2a3a}
#m.nl .r.c{flex-direction:row;justify-content:space-between}
#m.nl .cb{width:38px;height:16px;border-radius:9px;background:#0d2a3a;border:0;position:relative}
#m.nl .cb::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#1b5a78}
#m.nl .cb.on::after{left:24px;background:var(--a)}
#m.nl input[type=range]{height:2px;border:0}
#m.nl input[type=range]::-webkit-slider-thumb{width:11px;height:11px;border-radius:50%;background:var(--a)}
#m.nl select,#m.nl button{background:none;border:0;color:#fff;font:600 13px Ubuntu,sans-serif;text-align:right;width:110px}
#tabs div svg{width:26px;height:26px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}#tabs div.on{box-shadow:inset 2px 0 0 var(--a)}
.cb{background:linear-gradient(#363636,#222)}.cb.on{background:linear-gradient(var(--a),#6a8a1c)}
input[type=range]{box-shadow:inset 0 1px 2px #000}.g b{font-weight:700;letter-spacing:.2px}
#m:not(.nl){background:linear-gradient(180deg,#121316,#0d0e10);width:760px}
#m:not(.nl) .g{background:none;border:1px solid #2a2c30}#m:not(.nl) .g b{background:#121316;color:#e4e4e4;font-weight:700}
#tabs div svg{width:40px;height:40px;stroke-width:1.5}#tabs div{color:#5a5d63;filter:none}
.cb{width:8px;height:8px;border:1px solid #000;background:#2c2d30}.cb.on{background:#3f84e8;box-shadow:0 0 3px #3f84e8aa}
#m:not(.nl) button{width:156px;height:20px;font-weight:700;color:#e8e8e8;background:linear-gradient(#232427,#17181a);border:1px solid #000;box-shadow:0 0 0 1px #34363a inset}
#m:not(.nl) select{width:156px;height:18px;background:#1b1c1f;box-shadow:0 0 0 1px #2e3033 inset}
#m:not(.nl) input[type=range]{height:4px;background-color:#1a1b1d}
#pg{padding:26px 24px;gap:30px}.g{padding:18px 14px 8px}.r{margin:0 0 13px}.r.s{gap:7px}#m:not(.nl){width:800px}
.vi{width:54px;align-self:center;text-align:center;background:#1b1c1f;color:var(--tx);border:1px solid #000;box-shadow:0 0 0 1px #2e3033 inset;font:11px Tahoma,Verdana,sans-serif;padding:2px;outline:0}.vi:focus{box-shadow:0 0 0 1px var(--a) inset}
.r.lk{opacity:.42}.r.lk .cb,.r.lk select,.r.lk input{pointer-events:none;filter:grayscale(1)}

/* ================= DEFAULT MENU SKIN =================
   Scoped to #m:not(.nl) throughout, so the Neverlose skin is untouched. The
   groupbox is the real Win32 kind - a 1px frame with the caption sitting ON the
   top border, knocked out by a background patch - because that single detail is
   what makes the panel read correctly; a caption above the frame does not. */
#m:not(.nl){--mb:#0b0b10;--mln:#2b2b35;--mtx:#b9bec8;--mdim:#6a7080;--mfill:#22222b;
 --mctl:#1b1b23;--mctlb:#33333e;--macc:#4a7ebb;
 width:660px;background:var(--mb);border:1px solid #000;outline:1px solid #1e1e26;
 box-shadow:0 18px 60px #000a;font:11px Tahoma,Verdana,sans-serif;color:var(--mtx)}
#m:not(.nl) .bar{height:4px;background:linear-gradient(90deg,
 #e05fa8,#a95fd0,#6f6fd0,#4a8fd4,#49c2c8,#5fc08a,#9ec45f,#d9cc5a,#e0a04e,#dc6f5a,#d9566a)}
#m:not(.nl) .body{display:flex;align-items:stretch}

/* --- icon rail --- */
#m:not(.nl) #tabs{width:78px;flex:0 0 78px;background:var(--mb);
 border-right:1px solid var(--mln);padding:10px 0}
#m:not(.nl) #tabs div{height:72px;border:0;background:none;filter:none;color:#8e94a1;
 display:flex;align-items:center;justify-content:center;box-shadow:none;
 transition:color .14s ease,transform .14s ease}
#m:not(.nl) #tabs div svg{width:34px;height:34px;stroke-width:1.5}
#m:not(.nl) #tabs div:hover{color:#dfe4ec;transform:translateY(-1px)}
#m:not(.nl) #tabs div.on{color:#fff;background:none;box-shadow:inset 2px 0 0 var(--macc)}

/* --- page --- */
#m:not(.nl) #pg{padding:14px;gap:18px 20px;grid-template-columns:1fr 1fr;
 align-content:start;max-height:74vh}
#m:not(.nl) .g{border:1px solid var(--mln);background:none;border-radius:2px;
 padding:14px 12px 4px;margin:0}
#m:not(.nl) .g b{top:-6px;left:10px;background:var(--mb);padding:0 5px;
 color:var(--mtx);font-weight:400;font-size:11px}
#m:not(.nl) .r{margin:0 0 9px;gap:8px;min-height:15px}
#m:not(.nl) .r span{color:var(--mtx)}

/* --- checkbox: square to the LEFT of its label --- */
#m:not(.nl) .r.c{flex-direction:row;justify-content:flex-start;gap:9px}
#m:not(.nl) .r.c span{order:2;flex:1}
#m:not(.nl) .cb{order:1;flex:0 0 auto;width:8px;height:8px;border-radius:1px;
 background:#2a2a33;border:1px solid #3a3a45;transition:background .12s,border-color .12s}
#m:not(.nl) .cb.on{background:var(--macc);border-color:#5b8fd0;box-shadow:none}

/* --- keybind chip, right aligned and quiet --- */
#m:not(.nl) .kb{order:3;margin-left:auto;color:var(--mdim);font-size:10px;letter-spacing:.02em}

/* --- slider: label row, value right aligned beneath it, then the track --- */
#m:not(.nl) .r.s{gap:3px}
#m:not(.nl) .r.s>div{display:flex;flex-direction:column-reverse;gap:3px}
#m:not(.nl) .r.s .vi{align-self:flex-end;background:none;border:0;box-shadow:none;
 color:var(--mtx);font:11px Tahoma,Verdana,sans-serif;text-align:right;width:70px;padding:0;outline:0}
#m:not(.nl) input[type=range]{height:4px;border:0;border-radius:2px;background:var(--mfill)}

/* --- controls --- */
#m:not(.nl) select{width:100%;height:24px;background:var(--mctl);color:var(--mtx);
 border:1px solid var(--mctlb);border-radius:2px;padding:0 6px;font:11px Tahoma,Verdana,sans-serif}
#m:not(.nl) button{width:100%;height:26px;background:var(--mctl);color:#c3c8d2;
 border:1px solid var(--mctlb);border-radius:2px;font:11px Tahoma,Verdana,sans-serif;
 cursor:pointer;transition:background .13s,border-color .13s,color .13s}
#m:not(.nl) button:hover{background:#23232d;border-color:#454553;color:#fff}
#m:not(.nl) button:active{background:#15151c}
#m:not(.nl) input[type=color]{width:24px;height:12px;padding:0;border:1px solid #11151c;
 border-radius:1px;background:none;cursor:pointer}
#m:not(.nl) input[type=color]::-webkit-color-swatch{border:0}
#m:not(.nl) input[type=color]::-webkit-color-swatch-wrapper{padding:0}
#m:not(.nl) input[type=search]{background:var(--mctl);border:1px solid var(--mctlb);
 border-radius:2px;color:var(--mtx);height:26px;font:11px Tahoma,Verdana,sans-serif}


/* A label beside a full-width control squeezes into two or three wrapped lines,
   which is what made these panels look unlike the reference. Stack instead:
   caption on its own line, control full width underneath. */
#m:not(.nl) .r:has(> button),#m:not(.nl) .r:has(> select){
 flex-direction:column;align-items:stretch;gap:4px}
#m:not(.nl) .r:has(> button) span,#m:not(.nl) .r:has(> select) span{flex:0 0 auto}
#m:not(.nl) .r:has(> input[type=color]){flex-direction:row;align-items:center}
#m:not(.nl) .r:has(> input[type=color]) span{flex:1}
#m:not(.nl) .r > input[type=color]{margin-left:auto}
/* the search field is ours, not the reference's - keep it, but quiet */
#m:not(.nl) #pg > input[type=search]{height:24px;margin-bottom:4px;opacity:.75}
#m:not(.nl) #pg > input[type=search]:focus{opacity:1}
/* --- the panel opens rather than appearing --- */
@keyframes menuIn{from{opacity:0;transform:translate(-50%,-50%) scale(.985)}
 to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#m:not(.nl).vis{animation:menuIn .13s cubic-bezier(.22,.78,.3,1) both}
@media (prefers-reduced-motion:reduce){#m:not(.nl).vis{animation:none}
 #m:not(.nl) #tabs div{transition:none}}
</style></head><body>

<script>
/* ===== online ruleset =====
   Read from the session the launcher wrote. In an online match the features below
   are blocked where they are USED, not merely hidden in the menu, so editing a
   value in the UI, loading a config or running a Lua script cannot bring them back.
   Note honestly: this game is peer to peer, so these limits run on each player's
   own client. A player who edits their own build can still lift them for themselves,
   which is why the opponent's client independently checks incoming movement and
   reports anything impossible to the server. */
const SESSION = (()=>{try{return JSON.parse(sessionStorage.getItem('hvh_session_cfg')||'null')||{offline:true}}catch(e){return {offline:true}}})();
const ONLINE_MATCH = !SESSION.offline;
const RANKED = {maxSpeed:5, manip:false, magic:false, bots:false};
/* ===================== TEAMS AND MATCH STATE =====================
   Hoisted up here with the rest of the session rules: the HUD, the scoreboard
   and the spawn code all read these, and several of them run at the top level
   further down. Declared below their first use they would sit in a temporal
   dead zone and take the whole script out on load. */
const TEAM_ME=(SESSION.team==='T'||SESSION.team==='CT')?SESSION.team:'CT';
const TEAM_OP=TEAM_ME==='T'?'CT':'T';
const TNAME={T:'TERRORISTS',CT:'COUNTER-TERRORISTS'},TSHORT={T:'T',CT:'CT'};
const TCOL={T:'#d8a13a',CT:'#5b9bd5'},TDIM={T:'#6b4f1c',CT:'#2b4a6b'};
/* The owner (UID 1) may spectate as a commentator. Server-assigned; a client
   that simply claims uid 1 gets nothing, because everything this unlocks is
   local presentation - no weapon, no damage, no scoring. */
const IS_OWNER=SESSION.uid===1;
let DEBUG_FLY=false;
/* Per-match statistics. Deliberately separate from the lifetime account stats
   the backend keeps, and reset with the match. Assists are not tracked: the
   match runs peer to peer, so there is no authority that sees who damaged whom
   before a kill, and a made-up number is worse than an absent column. */
const MS={k:0,d:0,dmg:0,hs:0};
/* ===================== SCREEN EFFECTS =====================
   Grade, grain and scanlines are a CSS filter and one overlay element on top of
   the canvas, not another post-processing pass. That is deliberate: the
   composer is switched off entirely by Boost FPS and by the Performance preset,
   so a pass would silently stop working for exactly the people most likely to
   be using these. A compositor filter costs effectively nothing and survives
   both. */
const FXO=document.createElement('div');
FXO.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:5;mix-blend-mode:overlay;opacity:0';
const VIG=document.createElement('div');
VIG.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;'+
 'background:radial-gradient(ellipse at 50% 50%,transparent 42%,#000 100%)';
addEventListener('DOMContentLoaded',()=>document.body.append(FXO,VIG));
if(document.body)document.body.append(FXO,VIG);
/* one 64px tile of noise, tiled and nudged each frame - far cheaper than
   regenerating noise at screen size */
const GRAINURL=(()=>{const c=document.createElement('canvas');c.width=c.height=64;
 const q=c.getContext('2d'),im=q.createImageData(64,64);
 for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;
  im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
 q.putImageData(im,0,0);return c.toDataURL()})();
let _fxKey='';
function applyFX(){
 const key=[S.wsat,S.wbri,S.wcon,S.whue,S.grain,S.grainx,S.scan,S.scanx,S.vigx,S.vig].join('|');
 if(key===_fxKey)return; _fxKey=key;                    /* only touch the DOM on change */
 R.style.filter='saturate('+(S.wsat/100)+') brightness('+(S.wbri/100)+') contrast('+(S.wcon/100)+')'+
   (S.whue?' hue-rotate('+S.whue+'deg)':'');
 const layers=[];
 if(S.grain)layers.push('url('+GRAINURL+') repeat');
 if(S.scan)layers.push('repeating-linear-gradient(0deg,rgba(0,0,0,'+(S.scanx/100)+') 0 1px,transparent 1px 3px)');
 FXO.style.background=layers.join(',');
 FXO.style.opacity=layers.length?String(S.grain?S.grainx/100:1):'0';
 FXO.style.backgroundSize=S.grain?'64px 64px':'auto';
 VIG.style.opacity=S.vig?String(S.vigx/100):'0';
}
const BIND={tp:'V',manip:'K'};   /* the keys the game actually listens for */
let _skyPrev='';let LASTHIT=null;           /* who last damaged you, so a death credits a killer */
function msReset(){MS.k=MS.d=MS.dmg=MS.hs=0}
/* ===================== TAB SCOREBOARD, BLACKOUT, DEBUG FLY =====================
   Built as DOM rather than painted into the HUD canvas: it stays crisp at any
   resolution, reflows on a narrow screen, and costs nothing per frame while it
   is hidden. pointer-events stay off throughout, so it cannot swallow a click
   or disturb pointer lock - the match keeps running underneath, which is what
   an online scoreboard has to do. */
const SBOX=document.createElement('div');
SBOX.style.cssText='position:fixed;inset:0;display:none;align-items:center;justify-content:center;'+
 'pointer-events:none;z-index:40;font-family:Verdana,sans-serif;background:rgba(6,8,12,.55)';
const BLACK=document.createElement('div');
BLACK.style.cssText='position:fixed;inset:0;display:none;pointer-events:none;z-index:45;background:#000;'+
 'color:#7d8694;font-family:Verdana,sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:10px';
const DBG=document.createElement('div');
DBG.style.cssText='position:fixed;left:50%;top:58px;transform:translateX(-50%);display:none;pointer-events:none;'+
 'z-index:46;font:bold 11px Verdana;letter-spacing:.14em;color:#ffc04d;background:rgba(10,12,16,.72);padding:5px 14px';
DBG.textContent='DEBUG SPECTATE  ·  WASD + SPACE/CTRL  ·  F8 TO EXIT';
addEventListener('DOMContentLoaded',()=>{document.body.append(SBOX,BLACK,DBG)});
if(document.body)document.body.append(SBOX,BLACK,DBG);

function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
/* Everyone actually in the match, local player included. Bots are listed as
   bots; nothing is invented to fill a row. */
function roster(){
 const rows=[];
 rows.push({name:SESSION.name||'You',uid:SESSION.uid||0,team:TEAM_ME,me:true,
            k:MS.k,d:MS.d,dmg:MS.dmg,hs:MS.hs,ping:(typeof NETPING!=='undefined'&&NETPING)||0,bot:false,dead:!!pDead||P.hp<=0});
 bots.forEach(b=>{const st=b.st||(b.st={k:0,d:0,dmg:0,hs:0});
  rows.push({name:b.n,uid:0,team:b.remote?TEAM_OP:TEAM_OP,me:false,
             k:st.k,d:st.d,dmg:st.dmg,hs:st.hs,ping:b.remote?((typeof NETPING!=='undefined'&&NETPING)||0):0,
             bot:!b.remote,dead:!!b.dead})});
 (typeof mates!=='undefined'?mates:[]).forEach(m=>{const st=m.st||(m.st={k:0,d:0,dmg:0,hs:0});
  rows.push({name:m.n,uid:0,team:TEAM_ME,me:false,k:st.k,d:st.d,dmg:st.dmg,hs:st.hs,ping:0,bot:true,dead:!!m.dead})});
 return rows}
/* kills first, then fewest deaths, then damage, then name - a total order, so
   two players with identical lines never swap places between frames */
function sortRows(a,b){return b.k-a.k || a.d-b.d || b.dmg-a.dmg || String(a.name).localeCompare(String(b.name))}
function kd(k,d){return d===0?(k===0?'0.00':k.toFixed(2)):(k/d).toFixed(2)}

function sbSide(team,rows,sc_){
 const mine=score[0],theirs=score[1];
 const pts = team===TEAM_ME?mine:theirs;
 const list=rows.filter(r=>r.team===team).sort(sortRows);
 const head='<div style="display:flex;align-items:baseline;gap:10px;padding:0 0 7px">'+
  '<span style="font:bold '+(15*sc_)+'px Verdana;color:'+TCOL[team]+';letter-spacing:.1em">'+TNAME[team]+'</span>'+
  '<span style="font:bold '+(19*sc_)+'px Verdana;color:#fff">'+pts+'</span>'+
  '<span style="font:'+(10*sc_)+'px Verdana;color:#79818f;margin-left:auto">'+list.length+' player'+(list.length===1?'':'s')+'</span></div>';
