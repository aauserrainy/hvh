<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#0e0f12;--p:#16181c}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}

header h1{font-size:18px;margin:0;letter-spacing:.14em;text-transform:uppercase}header h1 b{color:var(--a)}

#wrap{flex:1;display:flex;min-height:0}

#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:12px;background:rgba(14,15,18,.82);border:1px solid var(--a);color:var(--t);font-size:11px;font-weight:700;white-space:nowrap;pointer-events:auto;cursor:pointer;transition:opacity .2s,background .2s}

</style></head><body>
<div id="app">
<header><h1><b id="sn"></b> &middot; Mirage</h1><span>HvH callout map &middot; drag to orbit, scroll/pinch to zoom, right-drag to pan</span></header>
<div id="wrap"><div id="stage"><canvas id="c"></canvas><div id="labels"></div><div id="hint">Click a callout to fly there</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= EDIT ME =================
   Everything is traced from the 1920px callout radar. Coordinates below are RADAR PIXELS (x right = east, y down = south).
   AREAS = walkable rectangles [name,x0,y0,x1,y1,floorHeight]; later rows override earlier ones. Everything not walkable becomes solid buildings.
   PROPS [type,px,py,size,rotY,y] types: crate barrel pot palm window.  ARCHES [px,py,rotY,width].  CALLS [name,px,py,distance,yawDeg,pitchDeg] */
const SERVER_NAME='YOUR SERVER NAME', ACCENT='#ff9d2e';
const PX=.07,CX=985,CY=975,CELL=22,BX0=200,BY0=290,BX1=1780,BY1=1670;
const AREAS=[
['CT Spawn',440,1290,690,1405,0],['CT Corridor',565,900,645,1295,0],['CT Plaza',600,1400,1190,1565,0],['CT Stairs',700,1560,1090,1625,0],
['A Site',905,1330,1200,1560,0],['Palm',905,1215,975,1335,0],['Connector',940,940,1005,1270,0],['E Stairs',1005,1130,1065,1255,.3],['Sandwich',1060,1190,1180,1255,.3],
['Tetris',1160,1165,1400,1290,.5],['T Ramp',1180,1210,1535,1290,.5],['Jungle',725,1090,915,1215,0],['Window',735,650,805,1100,.8],['Ladder Room',750,650,865,830,.8],['Vent',660,900,740,1120,0],
['Middle',810,800,1415,945,0],['Catwalk',865,770,1280,830,.6],['Chair',1065,945,1415,995,0],['Top Mid',1270,520,1415,950,0],
['Stairs',860,440,1170,520,1],['House Link',1030,300,1170,520,1],['House',1030,300,1465,400,1],['Side Alley',1265,380,1665,430,.8],['Side Alley 2',1270,430,1375,640,.8],
['B Apartments',430,320,845,400,1.2],['Stove',760,400,880,520,.8],['Cat',640,430,815,600,.8],['Cat Link',815,455,865,780,.8],['B Site',295,420,640,740,0],['Bench',210,420,295,610,0],['Van',300,320,430,420,.3],['Kitchen',320,740,640,905,0],
['T Spawn',1620,600,1750,1150,1],['T Alley',1385,380,1740,430,.8],['Troff',1415,1000,1525,1290,.5],['T Corridor',1420,1090,1620,1290,.5],['T Link',1540,1130,1620,1370,1],['Pillars',1210,1360,1625,1545,1.2],['Balcony',1200,1330,1285,1470,1.2]];
const PROPS=[['crate',975,1420,1.6,.3],['crate',1005,1408,1.6,-.2],['crate',1090,1418,1.8,.4],['crate',1118,1408,1.4,-.3],['crate',1112,1495,1.6,.2],['crate',1085,1520,1.2,0],
['crate',405,492,2.2],['crate',490,492,2.2],['crate',472,578,2.2],['crate',420,720,1.5],['crate',1300,880,1.5,.6],['crate',1330,845,1.5,.5],['crate',1320,915,1.5,.2],['crate',880,1495,1.4],
['barrel',925,1500],['barrel',1240,1440],['barrel',1150,1450],['barrel',500,1340],['barrel',560,700],['pot',950,1010],['pot',1260,1255],['pot',700,1420],['pot',1010,1140],
['palm',925,1300],['palm',1185,1250],['palm',380,640],['palm',1560,1180],['palm',1000,1560],['palm',640,1440]];
const ARCHES=[[972,942,0,5],[1100,1160,0,5],[1228,1362,0,6],[540,742,0,6],[1415,620,1.57,5],[1620,860,1.57,6],[800,1100,0,5],[690,1405,1.57,5]];
const CALLS=[['T Spawn',1690,880,38,90,42],['T Ramp',1350,1235,24,110,40],['Tetris',1250,1210,22,30,40],['A Site',1040,1450,34,0,48],['Palace',1420,1460,30,60,42],['Connector',972,1100,30,0,48],['Jungle',820,1150,26,30,42],['Window',770,900,30,70,44],['Middle',1100,870,34,0,50],['Top Mid',1340,740,34,90,46],['Catwalk',1070,800,28,20,42],['B Apartments',640,360,34,0,44],['B Site',470,570,38,10,48],['Kitchen',480,820,28,-30,42],['CT Spawn',560,1350,32,-60,44]];
/* =========================================== */
const X=p=>(p-CX)*PX,Z=p=>(p-CY)*PX;CALLS.forEach(c=>{c[1]=X(c[1]);c[2]=Z(c[2])});

const $=id=>document.getElementById(id),stage=$('stage'),V3=THREE.Vector3;
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const sc=new THREE.Scene();sc.fog=new THREE.FogExp2(0xeed8ae,.0042);
const cam=new THREE.PerspectiveCamera(50,1,.5,600);
/* sky */
sc.add(new THREE.Mesh(new THREE.SphereGeometry(400,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;void main(){float h=clamp(normalize(p).y*1.6,0.,1.);gl_FragColor=vec4(mix(vec3(.96,.86,.68),vec3(.30,.55,.88),h),1.);}'})));

const sun=new THREE.DirectionalLight(0xffe2b0,1.9);sun.position.set(-60,90,40);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:10,far:260});sun.shadow.bias=-.0005;sun.shadow.radius=3;sc.add(sun);
/* materials & helpers */
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true});
const SAND=[0xd9bd8a,0xcfb07c,0xe0c797].map(mat),FL=mat(0xc9ad7a),WOOD=mat(0x8a5a2e),BAND=mat(0x4a3a28),TERRA=mat(0xb5532f),DARK=mat(0x2a2218),GRN=mat(0x3c7a35),CLAY=mat(0xa65b36),DOOR=mat(0x335a78);
const BX=new THREE.BoxGeometry(1,1,1);let hs=0;
function box(x,y,z,w,h,d,m,ry){const o=new THREE.Mesh(BX,m);o.scale.set(w,h,d);o.position.set(x,y+h/2,z);if(ry)o.rotation.y=ry;o.castShadow=o.receiveShadow=true;sc.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0xc8ab78));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);
function wall(w){hs++;box(w[0],w[5]||0,w[1],w[2],w[4],w[3],SAND[hs%3]);if(w[4]>5&&!w[5])box(w[0],w[4],w[1],w[2]+.5,.4,w[3]+.5,SAND[2])}
function arch(a){const g=new THREE.Group(),w=a[3],t=new THREE.Mesh(new THREE.TorusGeometry(w/2,.28,6,14,Math.PI),SAND[2]),d=new THREE.Mesh(new THREE.CircleGeometry(w/2-.1,14,0,Math.PI),DOOR);t.position.y=d.position.y=w*.6;d.position.z=-.02;t.castShadow=true;g.add(t,d);const p=[-1,1].forEach(s=>{const o=new THREE.Mesh(BX,SAND[2]);o.scale.set(.56,w*.6,.9);o.position.set(s*w/2,w*.3,0);g.add(o)});const dr=new THREE.Mesh(BX,DOOR);dr.scale.set(w-.6,w*.6,.2);dr.position.set(0,w*.3,-.05);g.add(dr);g.position.set(a[0],0,a[1]);g.rotation.y=a[2];sc.add(g)}
function building(b){box(b[0],0,b[1],b[2],b[4],b[3],SAND[1]);const m=Math.max(b[2],b[3]),r=new THREE.Mesh(new THREE.ConeGeometry(m*.78,2.6,4),TERRA);r.rotation.y=Math.PI/4;r.scale.set(b[2]/m,1,b[3]/m);r.position.set(b[0],b[4]+1.3,b[1]);r.castShadow=true;sc.add(r)}
function ramp(r){const ax=r[6],L=ax=='z'?r[3]:r[2],dy=r[5]-r[4],h=Math.hypot(L,dy),o=box(r[0],0,r[1],ax=='z'?r[2]:h,.4,ax=='z'?h:r[3],FL);o.position.y=(r[4]+r[5])/2-.2;if(ax=='z')o.rotation.x=-Math.atan2(dy,L);else o.rotation.z=Math.atan2(dy,L)}
function stairs(s){const n=s[7],ax=s[6],L=ax=='z'?s[3]:s[2];for(let i=0;i<n;i++){const y=s[4]+(s[5]-s[4])*(i+1)/n,o=(i+.5)/n*L-L/2;box(ax=='z'?s[0]:s[0]+o,0,ax=='z'?s[1]+o:s[1],ax=='z'?s[2]:L/n,y,ax=='z'?L/n:s[3],FL)}}
function prop(p){const t=p[0],x=p[1],z=p[2],s=p[3]||1.5;if(t=='crate'){const y=p[5]||0;box(x,y,z,s,s,s,WOOD,p[4]||0);[.3,.7].forEach(k=>box(x,y+s*k-.06,z,s+.06,.12,s+.06,BAND,p[4]||0))}
else if(t=='barrel'){const o=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,1.3,10),WOOD);o.position.set(x,.65,z);o.castShadow=true;sc.add(o);[.3,1].forEach(h=>{const r=new THREE.Mesh(new THREE.CylinderGeometry(.58,.58,.1,10),BAND);r.position.set(x,h,z);sc.add(r)})}
else if(t=='pot'){const o=new THREE.Mesh(new THREE.LatheGeometry([[0,0],[.5,0],[.7,.5],[.55,1],[.35,1.15]].map(a=>new THREE.Vector2(a[0],a[1])),8),CLAY);o.position.set(x,0,z);o.castShadow=true;sc.add(o)}
else if(t=='palm'){const k=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,7,6),WOOD);k.position.set(x,3.5,z);k.castShadow=true;sc.add(k);for(let i=0;i<7;i++){const f=new THREE.Mesh(new THREE.ConeGeometry(.3,3,4),GRN),a=i*.9;f.scale.set(1,1,.3);f.position.set(x+Math.cos(a)*1.2,7.1,z+Math.sin(a)*1.2);f.rotation.set(Math.sin(a)*1.1,0,-Math.cos(a)*1.1);f.castShadow=true;sc.add(f)}}
else if(t=='window'){box(x,2.4,z+.9,2,2.4,.2,DARK,p[3]||0);box(x,2.2,z+1,2.4,.2,.4,SAND[2])}}
const hsh=(r,c)=>((r*73856093)^(c*19349663))>>>0;
function grid(){const cols=Math.ceil((BX1-BX0)/CELL),rows=Math.ceil((BY1-BY0)/CELL),g=[];for(let r=0;r<rows;r++){g[r]=[];for(let c=0;c<cols;c++){const px=BX0+(c+.5)*CELL,py=BY0+(r+.5)*CELL;let y=null;AREAS.forEach(a=>{if(px>=a[1]&&px<=a[3]&&py>=a[2]&&py<=a[4])y=a[5]});g[r][c]=y}}return g}
const G=grid();
function runs(fn){G.forEach((row,r)=>{let c=0;while(c<row.length){const k=fn(r,c);let e=c+1;while(e<row.length&&fn(r,e)===k)e++;fnRun(r,c,e,k);c=e}})}
let fnRun;
function buildFloors(){fnRun=(r,c,e,k)=>{if(k===null)return;const w=(e-c)*CELL*PX,x=X(BX0+(c+e)/2*CELL),z=Z(BY0+(r+.5)*CELL);box(x,k-.6,z,w+.01,.6,CELL*PX+.01,FL)};runs((r,c)=>G[r][c])}
function buildSolids(){fnRun=(r,c,e,k)=>{if(k===null)return;const w=(e-c)*CELL*PX,x=X(BX0+(c+e)/2*CELL),z=Z(BY0+(r+.5)*CELL),h=7+k*1.1;box(x,0,z,w+.01,h,CELL*PX+.01,SAND[(r>>3)%2]);if(e-c>4&&(hsh(r,c)%9)==0)box(x,h,z,w*.96,.5,CELL*PX*.96,TERRA)};runs((r,c)=>G[r][c]===null?((r>>3)*5+(c>>3)*11)%3:null)}
/* camera orbit state + tween */
const st={x:0,y:1.5,z:0,yaw:0,pitch:.8,dist:90},tw={t:1};let to=null;
const rad=Math.PI/180,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyCam(){const cp=Math.cos(st.pitch);cam.position.set(st.x+Math.sin(st.yaw)*cp*st.dist,st.y+Math.sin(st.pitch)*st.dist,st.z+Math.cos(st.yaw)*cp*st.dist);cam.lookAt(st.x,st.y,st.z)}
function fly(c){const f=Object.assign({},st);let y=c[4]*rad;while(y-st.yaw>Math.PI)y-=2*Math.PI;while(y-st.yaw<-Math.PI)y+=2*Math.PI;to={f,g:{x:c[1],y:1.5,z:c[2],yaw:y,pitch:c[5]*rad,dist:c[3]},t:0};document.querySelectorAll('.lbl,#list button').forEach(e=>e.classList.toggle('on',e.dataset.n==c[0]))}
/* input: mouse + touch via pointer events */
const ptr=new Map();let pd=0;
stage.addEventListener('pointerdown',e=>{if(e.target.classList.contains('lbl'))return;stage.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});to=null;pd=0});
stage.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
if(ptr.size==2){const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)st.dist=clamp(st.dist*pd/d,8,220);pd=d;pan(dx/2,dy/2)}
else if(p.b==2||e.shiftKey)pan(dx,dy);else{st.yaw-=dx*.006;st.pitch=clamp(st.pitch+dy*.005,.12,1.5)}});
const up=e=>{ptr.delete(e.pointerId);pd=0};stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{e.preventDefault();st.dist=clamp(st.dist*Math.exp(e.deltaY*.0012),8,220);to=null},{passive:false});
function pan(dx,dy){const k=st.dist*.0016,s=Math.sin(st.yaw),c=Math.cos(st.yaw);st.x=clamp(st.x-(dx*c+dy*s)*k,-70,70);st.z=clamp(st.z+(dx*s-dy*c)*k,-70,70)}
/* UI */
const LB=$('labels'),LS=CALLS.map(c=>{const d=document.createElement('div');d.className='lbl';d.textContent=c[0];d.dataset.n=c[0];d.onclick=()=>fly(c);LB.appendChild(d);const b=document.createElement('button');b.textContent=c[0];b.dataset.n=c[0];b.onclick=()=>fly(c);$('list').appendChild(b);return{d,p:new V3(c[1],7,c[2])}});
function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}

/* staged build with loading state */
const jobs=[['floors',buildFloors],['buildings',buildSolids],['props',()=>PROPS.forEach(p=>prop([p[0],X(p[1]),Z(p[2]),p[3],p[4],p[5]]))],['arches',()=>ARCHES.forEach(a=>arch([X(a[0]),Z(a[1]),a[2],a[3]]))]];

function frame(t){requestAnimationFrame(frame);step();
if(to){to.t=Math.min(1,to.t+.016/1.1);const k=to.t<.5?2*to.t*to.t:1-Math.pow(-2*to.t+2,2)/2;['x','y','z','yaw','pitch','dist'].forEach(n=>st[n]=to.f[n]+(to.g[n]-to.f[n])*k);if(to.t>=1)to=null}
else if(!ptr.size&&!to)st.yaw+=.0002;
applyCam();R.render(sc,cam);
const w=stage.clientWidth,h=stage.clientHeight;LS.forEach(l=>{const p=l.p.clone().project(cam);const v=p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;l.d.style.display=v?'':'none';if(v){l.d.style.left=(p.x+1)/2*w+'px';l.d.style.top=(1-p.y)/2*h+'px';l.d.style.opacity=clamp(1.3-st.dist/200,.45,1)}})}
st.dist=130;st.pitch=1.0;requestAnimationFrame(frame);
</script></body></html>
